<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <!-- SECURITY: Discourage browsers from caching this page (protects post-logout Back button) -->
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Blink Text — Encrypted Messaging</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; overflow: hidden; }
      body { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; background: #0a0a0a; color: #e0e0e0; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
      [data-theme="amoled"] body { background: #000000; }
      #root { height: 100%; display: flex; flex-direction: column; overflow: hidden; }
    </style>
    <script>
      // Apply saved theme before first paint to prevent flash
      (function(){var t=localStorage.getItem('blink-theme');if(t==='amoled')document.documentElement.setAttribute('data-theme','amoled');})();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
