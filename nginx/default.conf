# ─────────────────────────────────────────────────────────────────────
# nginx reverse proxy for blink-text (Docker)
#
# Proxies all traffic to the Node.js app container on port 3001.
# The app container serves the built web client + API + WebSocket.
# ─────────────────────────────────────────────────────────────────────

upstream app_backend {
    server app:3001;
}

server {
    listen 8080;
    server_name _;  # Replace _ with your domain, e.g. blink.yourdomain.com

    # Max upload size (for encrypted media sharing)
    client_max_body_size 64m;

    # SECURITY: Prevent browser from caching HTML pages (protects post-logout Back button)
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;

    # Proxy all traffic to the Node.js app container
    location / {
        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket support for Socket.io
    location /socket.io/ {
        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeout (prevent idle disconnect)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
